name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geo_core:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/geo_core
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test --coverage=coverage
      - name: Lefedettségi riport (lcov)
        run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore
      - uses: actions/upload-artifact@v4
        with:
          name: geo_core-coverage
          path: packages/geo_core/coverage/lcov.info

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.4
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
